<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice — dictation log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23fff' stroke='%23ed651b' stroke-width='3'/%3E%3Cg fill='none' stroke='%23ed651b' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 32 C 18 48, 46 48, 58 32'/%3E%3Cpath d='M6 32 C 18 48, 46 48, 58 32' transform='rotate(120 32 32)'/%3E%3Cpath d='M6 32 C 18 48, 46 48, 58 32' transform='rotate(240 32 32)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- async so the page never blocks on the network — this is a local-first tool;
     fallback stacks in style.css cover the offline case -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="bgArt" aria-hidden="true"></div>

<aside class="rail">
  <header class="brand">
    <svg class="brandBall" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="28"/>
      <g class="seams">
        <path d="M6 32 C 18 48, 46 48, 58 32"/>
        <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(120 32 32)"/>
        <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(240 32 32)"/>
      </g>
    </svg>
    <div class="brandText">
      <h1>VOICE</h1>
      <p>dictation log</p>
    </div>
  </header>

  <div class="recWrap">
    <button id="recBtn" class="recBtn" title="start / stop recording (same as the hotkey — text types into the focused window)">
      <svg class="recBall" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="28"/>
        <g class="seams">
          <path d="M6 32 C 18 48, 46 48, 58 32"/>
          <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(120 32 32)"/>
          <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(240 32 32)"/>
        </g>
      </svg>
    </button>
    <div class="statusLine"><span id="statusDot" class="dot"></span><span id="statusText">connecting…</span></div>
    <div id="recTimer" class="recTimer" hidden>0:00</div>
  </div>

  <dl class="scoreboard">
    <div><dt>takes</dt><dd id="statCount">–</dd></div>
    <div><dt>airtime</dt><dd id="statTime">–</dd></div>
    <div><dt>on disk</dt><dd id="statBytes">–</dd></div>
  </dl>

  <div class="railFoot">
    <button id="themesBtn" class="themesBtn">
      <span class="swatches"><i class="s1"></i><i class="s2"></i><i class="s3"></i></span>
      themes
    </button>
    <p class="hint">hotkey <kbd>Super</kbd> + <kbd>`</kbd></p>
  </div>
</aside>

<main>
  <div class="topbar">
    <input id="search" type="search" autocomplete="off" spellcheck="false"
           placeholder="search transcripts…">
    <span id="resultCount" class="resultCount"></span>
  </div>
  <section id="timeline" aria-live="polite"></section>
  <div id="empty" class="empty" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="28"/>
      <g class="seams">
        <path d="M6 32 C 18 48, 46 48, 58 32"/>
        <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(120 32 32)"/>
        <path d="M6 32 C 18 48, 46 48, 58 32" transform="rotate(240 32 32)"/>
      </g>
    </svg>
    <p id="emptyText">nothing here yet — press the hotkey and start talking</p>
  </div>
</main>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-label="themes">
  <div class="drawerHead">
    <h2>THEMES</h2>
    <button id="drawerClose" class="ghost" title="close">✕</button>
  </div>
  <p class="drawerNote">applies to this page <em>and</em> the on-screen recording pill</p>
  <div id="themeGrid"></div>

  <section id="editor" class="editor" hidden>
    <h3 id="editorTitle">custom theme</h3>
    <div class="pillStage" id="editorStage">
      <div class="pillPreview" id="editorPreview"></div>
    </div>
    <label class="nameRow">name<input id="themeName" maxlength="64"></label>
    <div id="colorRows"></div>
    <div class="editorBtns">
      <button id="saveTheme" class="primary">save &amp; apply</button>
      <button id="cancelEdit" class="ghost">cancel</button>
    </div>
  </section>
</aside>

<div id="toast" class="toast" hidden></div>

<template id="cardT">
  <article class="card">
    <header class="cardHead">
      <button class="play" title="play">
        <svg class="iPlay" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="iPause" viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
      </button>
      <span class="time mono"></span>
      <span class="dur mono"></span>
      <span class="grow"></span>
      <span class="actions">
        <button class="act copy" title="copy transcript">
          <svg viewBox="0 0 16 16"><path d="M5.5 1.5h8a1 1 0 0 1 1 1v8h-2v-7h-7z"/><rect x="1.5" y="4.5" width="9" height="10" rx="1"/></svg>
        </button>
        <button class="act redo" title="re-transcribe">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.7 1.6v3h-3" stroke-linejoin="round"/></svg>
        </button>
        <button class="act del" title="delete recording + transcript">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.5h6.6L12 4M6.6 7v4M9.4 7v4"/></svg>
        </button>
      </span>
    </header>
    <canvas class="wave" height="56"></canvas>
    <p class="text"></p>
  </article>
</template>

<script src="/static/app.js"></script>
</body>
</html>
